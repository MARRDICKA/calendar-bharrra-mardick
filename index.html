<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tugas Pak Yudi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="brand">

                <div class="logo">
                    <i>ML </i>
                </div>

                <div>
                    <h1>Mpoenlendar</h1>
                    <p>Plan your next steps</p>
                </div>
                
                    </div>

            <button class="header-add" id="headerAdd">
                <span>+</span>
                Add Event
            </button>

        </header>


        <!-- ================= MAIN ================= -->

        <main class="main">

            <section class="calendar-wrapper">

                <!-- CALENDAR TOP -->

                <div class="calendar-top">

                    <button class="back-button" id="backButton">
                        ←
                    </button>


                    <div class="month-container">

                        <button class="month-button" id="monthButton">

                            <span id="monthTitle">
                                September 2026
                            </span>

                            <span class="chevron">
                                ▾
                            </span>

                        </button>


                        <!-- MONTH YEAR PICKER -->

                        <div class="month-picker" id="monthPicker">

                            <div class="year-control">

                                <button id="previousYear">
                                    ‹
                                </button>

                                <strong id="pickerYear">
                                    2026
                                </strong>

                                <button id="nextYear">
                                    ›
                                </button>

                            </div>


                            <div class="month-grid" id="monthGrid"></div>

                        </div>

                    </div>


                    <div class="calendar-navigation">

                        <button class="nav-button" id="previousMonth">
                            ‹
                        </button>

                        <button class="today-button" id="todayButton">
                            Today
                        </button>

                        <button class="nav-button" id="nextMonth">
                            ›
                        </button>

                    </div>

                </div>


                <!-- WEEK -->

                <div class="week">

                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>

                </div>


                <!-- CALENDAR -->

                <div class="calendar" id="calendar"></div>


                <!-- LEGEND -->

                <div class="legend">

                    <div>
                        <span class="dot blue"></span>
                        Meeting
                    </div>

                    <div>
                        <span class="dot green"></span>
                        Personal
                    </div>

                    <div>
                        <span class="dot yellow"></span>
                        Important
                    </div>

                    <div>
                        <span class="dot red"></span>
                        Deadline
                    </div>

                    <div>
                        <span class="dot purple"></span>
                        Other
                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- ==================================================
         EVENT POPUP
    ================================================== -->

    <div class="overlay" id="eventOverlay">

        <div class="event-popup">

            <!-- POPUP HEADER -->

            <div class="popup-header">

                <div>

                    <span class="popup-small">
                        CALENDAR
                    </span>

                    <h2 id="popupDate">
                        September 14, 2026
                    </h2>

                    <p id="popupDay">
                        Monday
                    </p>

                </div>


                <button class="close-button" id="closePopup">
                    ×
                </button>

            </div>


            <!-- EVENT VIEW -->

            <div class="event-view" id="eventView">

                <div class="popup-event-list" id="popupEventList"></div>


                <!-- ADD EVENT BUTTON -->

                <button class="popup-add-button" id="popupAddButton">

                    <span>+</span>

                    Add Event

                </button>

            </div>


            <!-- ==========================================
                 ADD / EDIT FORM
            =========================================== -->

            <div class="event-form-view" id="eventFormView">

                <form id="eventForm">

                    <div class="form-title">

                        <div>

                            <span class="popup-small">
                                EVENT
                            </span>

                            <h2 id="formTitle">
                                Add Event
                            </h2>

                        </div>

                        <button type="button" class="close-button" id="formBack">
                            ←
                        </button>

                    </div>


                    <!-- EVENT NAME -->

                    <div class="input-group">

                        <label>
                            Event Name
                        </label>

                        <input type="text" id="eventName" placeholder="e.g. Team Meeting" required>

                    </div>


                    <!-- DATE / TIME -->

                    <div class="form-row">

                        <div class="input-group">

                            <label>
                                Date
                            </label>

                            <input type="date" id="eventDate" required>

                        </div>


                        <div class="input-group">

                            <label>
                                Time
                            </label>

                            <input type="time" id="eventTime">

                        </div>

                    </div>


                    <!-- CATEGORY -->

                    <div class="input-group">

                        <label>
                            Category
                        </label>

                        <select id="eventCategory">

                            <option value="blue">
                                Meeting
                            </option>

                            <option value="green">
                                Personal
                            </option>

                            <option value="yellow">
                                Important
                            </option>

                            <option value="red">
                                Deadline
                            </option>

                            <option value="purple">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="input-group">

                        <label>
                            Description
                        </label>

                        <textarea id="eventDescription" rows="4" placeholder="Add event details..."></textarea>

                    </div>


                    <!-- BUTTON -->

                    <div class="form-buttons">

                        <button type="button" class="cancel-button" id="cancelForm">
                            Cancel
                        </button>

                        <button type="submit" class="save-button">
                            Save Event
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
